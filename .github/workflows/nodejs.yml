name: Node CI
permissions:
  contents: write
on:
  - push
  - pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x
          - ">= 27.0.0-alpha.0 <= 27.x"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Redrun
        run: bun i redrun madrun -g --no-save
      - name: Install
        run: bun i --no-save
      - name: Init Madrun
        run: madrun --init
      - name: Bootstrap
        run: redrun bootstrap
      - name: Lint
        run: redrun lint
